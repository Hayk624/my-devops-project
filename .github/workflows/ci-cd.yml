name: CI/CD Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install -r requirements.txt
      - run: python -m compileall -q api

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install -r requirements.txt
      - run: pytest -v test_app.py

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_DOMAIN: ${{ secrets.VERCEL_DOMAIN }}
        run: |
          set -e
          npm i -g vercel@latest
          mkdir -p logs
          chmod +x scripts/healthcheck.sh

          if [ "${{ github.ref }}" = "refs/heads/main" ] && [ "${{ github.event_name }}" = "push" ]; then
            if [ -z "$VERCEL_DOMAIN" ]; then
              echo "Secret VERCEL_DOMAIN is required for Blue-Green deployment"
              exit 1
            fi

            # Find the current production deployment (Blue).
            OLD_DEPLOYMENT_URL=$(curl -sS \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v6/deployments?projectId=$VERCEL_PROJECT_ID&teamId=$VERCEL_ORG_ID&target=production&limit=2" |
              jq -r '.deployments[] | select(.readyState == "READY") | .url' |
              head -1)

            # Create the Green deployment without changing the production domain.
            DEPLOY_OUTPUT=$(vercel deploy --prod --skip-domain --yes \
              --project "$VERCEL_PROJECT_ID")
            CANDIDATE_URL=$(printf '%s\n' "$DEPLOY_OUTPUT" | sed 's/\x1b\[[0-9;]*m//g' |
              grep -Eo 'https://[^[:space:]]+' | tail -1)

            if [ -z "$CANDIDATE_URL" ]; then
              echo "Could not determine the Green deployment URL"
              exit 1
            fi

            echo "Green deployment: $CANDIDATE_URL"
            vercel inspect "$CANDIDATE_URL" --wait --timeout=5m \
              --project "$VERCEL_PROJECT_ID"

            # Check Green before switching the production domain.
            if ! ./scripts/healthcheck.sh "$CANDIDATE_URL" logs/health.log; then
              echo "Green deployment failed healthcheck; production remains on Blue"
              exit 1
            fi

            echo "Promoting Green to production"
            vercel promote "$CANDIDATE_URL" --yes \
              --project "$VERCEL_PROJECT_ID"

            # Verify the promoted deployment through the public domain.
            if ! ./scripts/healthcheck.sh "https://$VERCEL_DOMAIN" logs/health.log; then
              echo "Production healthcheck failed; rolling back to Blue"
              if [ -n "$OLD_DEPLOYMENT_URL" ]; then
                vercel rollback "https://$OLD_DEPLOYMENT_URL" --yes \
                  --project "$VERCEL_PROJECT_ID"
              fi
              exit 1
            fi
          else
            DEPLOY_OUTPUT=$(vercel deploy --yes \
              --project "$VERCEL_PROJECT_ID")
            URL=$(printf '%s\n' "$DEPLOY_OUTPUT" | sed 's/\x1b\[[0-9;]*m//g' |
              grep -Eo 'https://[^[:space:]]+' | tail -1)

            if [ -z "$URL" ]; then
              echo "Could not determine the preview deployment URL"
              exit 1
            fi

            ./scripts/healthcheck.sh "$URL" logs/health.log
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: health-log
          path: logs/health.log
